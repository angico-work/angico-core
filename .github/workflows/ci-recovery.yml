name: CI recovery verification

on:
  push:
    branches: [fix/ci-recovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [app, site]
    defaults:
      run:
        working-directory: apps/${{ matrix.project }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Resolve compatible security updates
        run: |
          npm pkg set 'devDependencies.vite=^8.1.6'
          npm audit fix --package-lock-only --ignore-scripts
      - name: Export resolved dependencies for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependencies-${{ matrix.project }}
          path: |
            apps/${{ matrix.project }}/package.json
            apps/${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm audit --audit-level=high
