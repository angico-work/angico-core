<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angico App · Memória territorial</title>
    <meta name="description" content="Aplicação operacional do Angico para registrar evidências, ações e memória territorial." />
    <meta name="theme-color" content="#00374F" />
    <link rel="icon" href="/angico-icone-main.png" />
    <!-- Brand type per the Angico spec: Garet (display) + Nourd (body). They are
         commercial, so Outfit + Hanken Grotesk stand in with the same geometric
         DNA; drop the real woff2 into /fonts and enable the @font-face stubs in
         styles.css for exact fidelity. Spline Sans Mono is reserved for
         coordinates and Angico IDs (the territorial vernacular). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/angico-leaf.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <!-- PWA: installable + offline-capable (service worker registered in main.tsx). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/angico-icone-main.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Angico" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
