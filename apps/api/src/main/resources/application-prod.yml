spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${ANGICO_DB_URL}
    username: ${ANGICO_DB_USER}
    password: ${ANGICO_DB_PASSWORD}
    hikari:
      # Each Vercel instance owns a pool; avoid exhausting Supabase's session limit.
      maximum-pool-size: ${ANGICO_DB_POOL_SIZE:2}
      minimum-idle: 0
      idle-timeout: 10000
      max-lifetime: 300000
      keepalive-time: 0
      connection-timeout: 10000
  servlet:
    multipart:
      max-request-size: ${ANGICO_UPLOAD_MAX_REQUEST_SIZE:4MB}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${ANGICO_FLYWAY_ENABLED:true}
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
    validate-migration-naming: true

angico:
  auth:
    cookie-secure: true
  allowed-origins: ${ANGICO_ALLOWED_ORIGINS}
