spring:
  application:
    name: angico-api
  servlet:
    multipart:
      max-file-size: ${ANGICO_UPLOAD_MAX_FILE_SIZE:2MB}
      max-request-size: ${ANGICO_UPLOAD_MAX_REQUEST_SIZE:8MB}
  datasource:
    url: ${ANGICO_DB_URL:jdbc:h2:mem:angico;DB_CLOSE_DELAY=-1}
    username: ${ANGICO_DB_USER:sa}
    password: ${ANGICO_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:${PORT:8082}}

angico:
  allowed-origins: ${ANGICO_ALLOWED_ORIGINS:http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176}
  auth:
    required: ${ANGICO_AUTH_REQUIRED:true}
    seed-leaders-enabled: ${ANGICO_SEED_LEADERS_ENABLED:true}
    seed-leader-password: ${ANGICO_SEED_LEADER_PASSWORD:Angico@2026!}
  uploads:
    dir: ${ANGICO_UPLOAD_DIR:uploads}
    max-bytes: ${ANGICO_UPLOAD_MAX_BYTES:2097152}
    allowed-content-types: ${ANGICO_UPLOAD_ALLOWED_TYPES:image/jpeg,image/png,image/webp,application/pdf,text/plain}
  geocoder:
    provider: ${ANGICO_GEOCODER_PROVIDER:nominatim}
    user-agent: ${ANGICO_GEOCODER_USER_AGENT:Angico/0.1 contact@example.com}
    default-country: ${VITE_DEFAULT_COUNTRY:BR}
