spring:
  application:
    name: angico-api
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: ${ANGICO_UPLOAD_MAX_FILE_SIZE:2MB}
      max-request-size: ${ANGICO_UPLOAD_MAX_REQUEST_SIZE:8MB}
  jpa:
    open-in-view: false
  flyway:
    enabled: false
  jackson:
    serialization:
      fail-on-empty-beans: true
server:
  port: ${SERVER_PORT:${PORT:8082}}

angico:
  auth:
    required: ${ANGICO_AUTH_REQUIRED:true}
    public-registration: ${ANGICO_PUBLIC_REGISTRATION:false}
    cookie-secure: ${ANGICO_COOKIE_SECURE:true}
  allowed-origins: ${ANGICO_ALLOWED_ORIGINS:}
  seed-demo-leader: ${ANGICO_SEED_DEMO_LEADER:false}
  seed-demo-leader-password: ${ANGICO_SEED_DEMO_LEADER_PASSWORD:}
  geocoder:
    provider: ${ANGICO_GEOCODER_PROVIDER:nominatim}
    user-agent: ${ANGICO_GEOCODER_USER_AGENT:Angico/0.1 (contato@angico.app)}
    default-country: ${ANGICO_GEOCODER_DEFAULT_COUNTRY:BR}
  uploads:
    dir: ${ANGICO_UPLOAD_DIR:uploads}
    max-bytes: ${ANGICO_UPLOAD_MAX_BYTES:2097152}
    allowed-content-types: ${ANGICO_UPLOAD_ALLOWED_TYPES:image/jpeg,image/png,image/webp,application/pdf,text/plain}
